version: '3.8'

services:
  # Sentinel Core Web App (Node API + React SPA)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/sentinel_compliance
      - JWT_SECRET=${JWT_SECRET:-generate_secure_random_key_change_me_32char}
      - CLIENT_URL=${CLIENT_URL:-*}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads_data:/app/server/uploads

  # MongoDB Service (Omit if using MongoDB Atlas in cloud)
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=sentinel_compliance
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
  uploads_data:
